read_register:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: irsap_clima
    address:
      required: true
      example: 224
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      default: 1
      selector:
        number:
          min: 1
          max: 32
          mode: box

write_register:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: irsap_clima
    address:
      required: true
      example: 224
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    value:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 65535
          mode: box
