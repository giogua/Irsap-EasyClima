name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      # The Home Assistant plugin blocks sockets: the client tests need them.
      - run: pytest -q -p no:homeassistant -p no:pytest_homeassistant_custom_component tests/test_api.py tests/test_fan.py
      - run: PYTHONPATH=. pytest -q -p no:cacheprovider -o asyncio_mode=auto tests/ha
